description = 'Ballerina - SMPP'

allprojects {
    group = project.group
    version = project.version

    repositories {
        mavenLocal()
        mavenCentral()
        // ballerina-runtime and stdlib native jars (compiled against by the native glue)
        // aren't on Maven Central.
        maven {
            url = 'https://maven.wso2.org/nexus/content/repositories/releases/'
        }
        maven {
            url = 'https://maven.wso2.org/nexus/content/groups/wso2-public/'
        }
        maven {
            url = 'https://maven.pkg.github.com/ballerina-platform/*'
            credentials {
                username System.getenv("packageUser")
                password System.getenv("packagePAT")
            }
        }
    }

    ext {
        snapshotVersion = '-SNAPSHOT'
        timestampedVersionRegex = '.*-\\d{8}-\\d{6}-\\w.*\$'
    }
}

task build {
    dependsOn(":smpp-native:build")
    dependsOn(":smpp-ballerina:build")
}

task clean {
    dependsOn(":smpp-native:clean")
    dependsOn(":smpp-ballerina:clean")
}
