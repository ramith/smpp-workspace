[package]
org = "ramith"
name = "smpp"
version = "@toml.version@"
authors = ["Ramith Jayasinghe"]
keywords = ["smpp", "sms", "messaging"]
repository = "https://github.com/ramith/smpp-workspace"
icon = "icon.png"
readme = "Package.md"
license = ["Apache-2.0"]
# Must stay in lockstep with `ballerinaLangVersion` in smpp/gradle.properties — the
# io.ballerina.plugin harness builds and tests the package with exactly that distribution,
# so declaring a higher minimum here would claim support for a version nothing is built on.
# (D10 asked whether 13.0 was ever exercised: it is, by every ./gradlew build.)
distribution = "2201.13.0"

[build-options]
observabilityIncluded = false

[platform.java21]
# Deliberate, not a known technical blocker (owner, 2026-07-29): GraalVM native-image
# builds are very slow, and native-image support is not a requirement for this package,
# so the build cost is not justified. Whether jsmpp would work under native-image at all
# is untested and unknown. Revisit only if a consumer actually needs it.
graalvmCompatible = false

# Hand-written native glue that bridges jsmpp callbacks into the Ballerina runtime.
[[platform.java21.dependency]]
groupId = "io.ballerina.lib"
artifactId = "smpp-native"
version = "@project.version@"
path = "../native/build/libs/smpp-native-@project.version@.jar"

# jsmpp, copied into ./lib by copyToLib. Its slf4j-api dependency is NOT bundled — the
# Ballerina runtime already provides slf4j on the classpath (bundling it duplicates slf4j).
[[platform.java21.dependency]]
groupId = "org.jsmpp"
artifactId = "jsmpp"
version = "@jsmpp.version@"
path = "./lib/jsmpp-@jsmpp.version@.jar"

# Test-only mock-SMSC bridge — never bundled into the published package.
[[platform.java21.dependency]]
groupId = "io.ballerina.lib"
artifactId = "smpp-native-test-bridge"
version = "@project.version@"
path = "../native/build/libs/smpp-native-test-bridge-@project.version@.jar"
scope = "testOnly"
