plugins {
    id 'java-library'
}

description = 'Ballerina - SMPP Native'

// The native glue compiles against Ballerina's Java-interop API (io.ballerina.runtime.api.*).
// The runtime is resolved from Maven (org.ballerinalang:ballerina-runtime, served from GitHub
// Packages via the repos in the root build.gradle) — matching how ballerinax connectors do it,
// with no dependency on a local `bal` install or the distribution's on-disk layout. It is
// compileOnly for the main glue because the real classes are supplied by the Ballerina runtime
// at execution time.

dependencies {
    compileOnly "org.ballerinalang:ballerina-runtime:${ballerinaLangVersion}"
    implementation group: 'org.jsmpp', name: 'jsmpp', version: "${jsmppVersion}"

    // DispatcherTest/NativeListenerTest only call static/package-private methods and never
    // construct a Dispatcher or touch a Runtime directly — but the JVM still resolves *all*
    // of a class's member types (including an unused constructor's Runtime parameter) when
    // linking it, so loading Dispatcher.class at all requires this to be on the classpath,
    // not just compileOnly like the main source.
    testImplementation "org.ballerinalang:ballerina-runtime:${ballerinaLangVersion}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

jar {
    archiveBaseName = 'smpp-native'
}

// A minimal, test-only mock SMSC bridge (bind + send one data_sm), consumed by
// smpp/ballerina/tests/mocksmsc.bal via `scope = "testOnly"` in Ballerina.toml — never
// shipped in the production package. A distinct source set (not the main jar) so it
// can't accidentally end up in what gets published.
sourceSets {
    testBridge {
        java {
            srcDirs = ['src/testBridge/java']
        }
    }
}

configurations {
    testBridgeImplementation.extendsFrom implementation
}

dependencies {
    testBridgeImplementation group: 'org.jsmpp', name: 'jsmpp', version: "${jsmppVersion}"
    // Ballerina's `string` interops as BString, not java.lang.String directly.
    testBridgeCompileOnly "org.ballerinalang:ballerina-runtime:${ballerinaLangVersion}"
}

tasks.register('testBridgeJar', Jar) {
    archiveBaseName = 'smpp-native-test-bridge'
    from sourceSets.testBridge.output
}

build.dependsOn testBridgeJar
