plugins {
    id 'java-library'
}

description = 'Ballerina - SMPP Native'

// `ballerina-runtime` isn't reliably resolvable from a public Maven repo under a version
// matching this project's distribution, and it doesn't need to be: the native glue only
// needs it to compile against Ballerina's Java-interop API (io.ballerina.runtime.api.*) —
// the real classes are supplied by the Ballerina runtime itself when the connector
// executes, so this is compileOnly and comes straight from the locally installed
// distribution (auto-detected via `bal home`, overridable with -PballerinaHome=... or the
// BALLERINA_HOME env var for CI images that don't have `bal` on PATH).
def ballerinaHome = project.hasProperty('ballerinaHome')
        ? project.property('ballerinaHome')
        : (System.getenv('BALLERINA_HOME')
            ?: providers.exec { commandLine 'bal', 'home' }.standardOutput.asText.get().trim())

dependencies {
    compileOnly fileTree(dir: "${ballerinaHome}/bre/lib", include: 'ballerina-rt-*.jar')
    implementation group: 'org.jsmpp', name: 'jsmpp', version: "${jsmppVersion}"

    // DispatcherTest/NativeListenerTest only call static/package-private methods and never
    // construct a Dispatcher or touch a Runtime directly — but the JVM still resolves *all*
    // of a class's member types (including an unused constructor's Runtime parameter) when
    // linking it, so loading Dispatcher.class at all requires this to be on the classpath,
    // not just compileOnly like the main source.
    testImplementation fileTree(dir: "${ballerinaHome}/bre/lib", include: 'ballerina-rt-*.jar')
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

jar {
    archiveBaseName = 'smpp-native'
}

// A minimal, test-only mock SMSC bridge (bind + send one data_sm), consumed by
// smpp/ballerina/tests/mocksmsc.bal via `scope = "testOnly"` in Ballerina.toml — never
// shipped in the production package. A distinct source set (not the main jar) so it
// can't accidentally end up in what gets published.
sourceSets {
    testBridge {
        java {
            srcDirs = ['src/testBridge/java']
        }
    }
}

configurations {
    testBridgeImplementation.extendsFrom implementation
}

dependencies {
    testBridgeImplementation group: 'org.jsmpp', name: 'jsmpp', version: "${jsmppVersion}"
    // Ballerina's `string` interops as BString, not java.lang.String directly.
    testBridgeCompileOnly fileTree(dir: "${ballerinaHome}/bre/lib", include: 'ballerina-rt-*.jar')
}

tasks.register('testBridgeJar', Jar) {
    archiveBaseName = 'smpp-native-test-bridge'
    from sourceSets.testBridge.output
}

build.dependsOn testBridgeJar
