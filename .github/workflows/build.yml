name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest   # Docker is preinstalled — required by io.ballerina.plugin (isConnector = true)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The native subproject runs `bal home` to locate ballerina-rt jars for compiling
      # the Java glue, so bal must be on the runner (the Docker image only covers the
      # Ballerina build, not the host-side native compile).
      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1
        with:
          version: 2201.13.0

      - name: Build and test
        working-directory: smpp
        env:
          # Resolves io.ballerina.plugin from ballerina-platform GitHub Packages.
          # packageUser is the PAT owner; packagePAT is a read:packages classic PAT.
          packageUser: ${{ github.repository_owner }}
          packagePAT: ${{ secrets.BALLERINA_PACKAGE_PAT }}
        run: ./gradlew build --stacktrace
