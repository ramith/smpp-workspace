name: Release

# Publishes ramith/smpp to Ballerina Central. Triggered by pushing a version tag
# (e.g. v1.0.0) or run manually. NOTE: Central pushes are IMMUTABLE — a version can
# be published only once. Review carefully before the first run.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Installs bal on the runner for the `bal push` step (the gradle build itself
      # runs bal inside the ballerina/ballerina:2201.13.0 container).
      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1
        with:
          version: 2201.13.0

      - name: Build and test
        working-directory: smpp
        env:
          packageUser: ${{ github.repository_owner }}
          packagePAT: ${{ secrets.BALLERINA_PACKAGE_PAT }}
        run: ./gradlew build --stacktrace

      - name: Push to Ballerina Central
        working-directory: smpp/ballerina
        env:
          BALLERINA_CENTRAL_ACCESS_TOKEN: ${{ secrets.BALLERINA_CENTRAL_ACCESS_TOKEN }}
        run: bal push
