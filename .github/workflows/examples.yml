name: Examples

# Builds every example against the published ramith/smpp connector (pulled from
# Ballerina Central) plus the mock SMSC harness, so the examples can't silently rot.
on:
  push:
    branches: [ main ]
    paths: [ 'examples/**', '.github/workflows/examples.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'examples/**', '.github/workflows/examples.yml' ]

jobs:
  build-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.0
        with:
          version: 2201.13.4

      - name: Build all examples
        run: ./examples/build.sh

      # Run-and-assert: start the mock SMSC per scenario, run each example, and check
      # it logs the expected line. Proves the examples work, not just that they compile.
      - name: Smoke-test all examples
        run: ./examples/smoke-test.sh
